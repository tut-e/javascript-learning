<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Мини-приложение Погоды</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f4f4f9;
        padding: 40px;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        max-width: 400px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .input-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        width: 90%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }
      button:hover {
        background: #0056b3;
      }
      #result {
        margin-top: 20px;
        padding: 10px;
        border-radius: 4px;
        min-height: 50px;
      }
      .success {
        background: #e2f0d9;
        color: #385723;
        border: 1px solid #c5e0b4;
      }
      .error {
        background: #fce4d6;
        color: #c65911;
        border: 1px solid #f8cbad;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Погода по координатам</h2>

      <div class="input-group">
        <label for="lat">Широта (Latitude):</label>
        <input type="number" id="lat" value="55.75" step="0.01" />
      </div>

      <div class="input-group">
        <label for="lon">Долгота (Longitude):</label>
        <input type="number" id="lon" value="37.62" step="0.01" />
      </div>

      <button id="get-weather-btn">Получить погоду</button>

      <div id="result"></div>
    </div>

    <script>
      const latInput = document.getElementById("lat");
      const lonInput = document.getElementById("lon");
      const getWeatherBtn = document.getElementById("get-weather-btn");
      const resultDiv = document.getElementById("result");

      getWeatherBtn.addEventListener("click", () => {
        const lat = parseFloat(latInput.value);
        const lon = parseFloat(lonInput.value);

        if (isNaN(lat) || isNaN(lon)) {
          resultDiv.innerHTML =
            '<p style="color: red;">Пожалуйста, введите корректные координаты.</p>';
          return;
        }

        console.log(
          `Отправка запроса для координат: Широта ${lat}, Долгота ${lon}`,
        );

        fetchWeatherData(lat, lon);
      });

      async function fetchWeatherData(lat, lon) {
        resultDiv.innerHTML = "Загрузка...";

        const url = `https://api.open-meteo.com?latitude=${lat}&longitude=${lon}&current_weather=true`;

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error("Ошибка сети");

          const data = await response.json();

          if (data.current && data.current.temperature_2m !== undefined) {
            const temp = data.current.temperature_2m;
            resultDiv.innerHTML = `<p>Текущая температура: <strong>${temp}°C</strong></p>`;
          } else {
            throw new Error("Неверная структура данных ответа");
          }
        } catch (error) {
          resultDiv.innerHTML = `<p style="color: red;">Не удалось получить погоду: ${error.message}</p>`;
        }
      }
    </script>
  </body>
</html>
