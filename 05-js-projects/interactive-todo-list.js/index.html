<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>ToDo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Create your own ToDo List:</h1>

    <div class="todo-app">
      <input type="text" class="todo-input" placeholder="Введите задачу..." />
      <button class="add-btn" data-action="add">Добавить</button>

      <ul class="todo-list">
        <!-- Сюда должны добавляться новые задачи -->
      </ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
